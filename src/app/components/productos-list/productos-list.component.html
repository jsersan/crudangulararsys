<!-- src/app/components/productos-list/productos-list.component.html -->

<div class="container mt-4">
    <h2>Lista de Productos</h2>
  
    <!-- Fila con el buscador y el botón de nuevo producto -->
    <div class="row mb-3">
      <div class="col-md-6">
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Buscar por nombre</mat-label>
          <!-- [(ngModel)] requiere FormsModule; Enter lanza la búsqueda -->
          <input matInput [(ngModel)]="nombreBusqueda" (keyup.enter)="buscarPorNombre()">
          <!-- Solo mat-icon-button: con mat-button a la vez falla (NG0300 en el PDF, NG8023 al compilar en v22) -->
          <button mat-icon-button matSuffix (click)="buscarPorNombre()" aria-label="Buscar">
            <mat-icon>search</mat-icon>
          </button>
        </mat-form-field>
      </div>
  
      <div class="col-md-6 text-end">
        <!-- matButton="elevated" es la forma nueva de mat-raised-button -->
        <button matButton="elevated" color="primary" (click)="abrirFormulario()">
          <mat-icon>add</mat-icon> Nuevo Producto
        </button>
      </div>
    </div>
  
    <!-- Tabla con sombra: la fuente de datos es la página calculada -->
    <div class="mat-elevation-z8">
      <table mat-table [dataSource]="paginaActual()" class="w-100">
  
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let producto">{{ producto.id }}</td>
        </ng-container>
  
        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let producto">{{ producto.nombre }}</td>
        </ng-container>
  
        <ng-container matColumnDef="descripcion">
          <th mat-header-cell *matHeaderCellDef>Descripción</th>
          <td mat-cell *matCellDef="let producto">{{ producto.descripcion }}</td>
        </ng-container>
  
        <ng-container matColumnDef="precio">
          <th mat-header-cell *matHeaderCellDef>Precio</th>
          <td mat-cell *matCellDef="let producto">{{ producto.precio | currency }}</td>
        </ng-container>
  
        <ng-container matColumnDef="stock">
          <th mat-header-cell *matHeaderCellDef>Stock</th>
          <td mat-cell *matCellDef="let producto">{{ producto.stock }}</td>
        </ng-container>
  
        <!-- Acciones: editar y eliminar -->
        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let producto">
            <button mat-icon-button color="primary" (click)="abrirFormulario(producto)" aria-label="Editar">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="eliminarProducto(producto.id)" aria-label="Eliminar">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>
  
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  
        <!-- Fila que se muestra cuando no hay datos -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell text-center" colspan="6">No se encontraron productos</td>
        </tr>
      </table>
  
      <!-- Paginador controlado por los signals del componente -->
      <mat-paginator
        [length]="productos().length"
        [pageIndex]="pageIndex()"
        [pageSize]="pageSize()"
        [pageSizeOptions]="[5, 10, 25]"
        (page)="cambiarPagina($event)"
        showFirstLastButtons>
      </mat-paginator>
    </div>
  </div>
